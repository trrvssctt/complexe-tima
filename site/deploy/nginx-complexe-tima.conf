# /etc/nginx/sites-available/complexe-tima  (lien dans sites-enabled)
# Le HTTPS est ajouté ensuite par : certbot --nginx -d complexe-tima.com -d www.complexe-tima.com
server {
    listen 80;
    listen [::]:80;
    server_name complexe-tima.com www.complexe-tima.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
